<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>TLDRGraph Workflow Explorer</title>
  <style>/*__STYLES__*/</style>
</head>
<body>
  <header>
    <div class="brand"><span>TLDR</span>Graph <small>Workflow Explorer</small></div>
    <div class="source-controls">
      <span id="source-status">Source not connected</span>
    </div>
  </header>
  <div id="state-banner" hidden></div>
  <main>
    <aside class="catalog">
      <input id="search" type="search" placeholder="Search capabilities and source">
      <div id="summary"></div>
      <div id="catalog"></div>
    </aside>
    <section class="workspace">
      <div id="workflow-header">
        <div><span id="status-badge"></span><span id="audience"></span></div>
        <h1 id="workflow-title">Select a workflow</h1>
        <p id="workflow-summary">Choose a source-backed capability from the catalog.</p>
        <div id="workflow-evidence"></div>
      </div>
      <canvas id="workflow-canvas"></canvas>
      <div class="canvas-tools">
        <button id="zoom-out">−</button><span id="zoom-label">100%</span>
        <button id="zoom-in">+</button><button id="fit">Fit</button>
      </div>
      <aside id="detail" hidden>
        <button id="close-detail" aria-label="Close">×</button>
        <span id="detail-phase"></span><h2 id="detail-title"></h2>
        <p id="detail-text"></p><div id="detail-evidence"></div>
      </aside>
    </section>
  </main>
  <div id="source-viewer" hidden>
    <div class="source-panel">
      <div class="source-header">
        <div><strong id="source-path"></strong><span id="source-meta"></span></div>
        <div><a id="open-editor">Open in editor</a><button id="close-source">×</button></div>
      </div>
      <pre id="source-code"></pre>
    </div>
  </div>
  <script>const DATA=/*__DATA_JSON__*/;</script>
  <script>/*__SOURCEVIEW_JS__*/</script>
  <script>/*__APP_JS__*/</script>
</body>
</html>
